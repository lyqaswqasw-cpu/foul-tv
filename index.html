<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOUL TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Arial, sans-serif; }

    #player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* مربع FOUL TV الأسود المضبوط على حجم ومكان شعار beIN SPORTS */
    .foul-watermark {
      position: absolute;
      top: 6.5%;          /* نازل قليلاً من الأعلى ليغطي الشعار بالضبط */
      right: 4.2%;        /* في جهة اليمين على مكان شعار القناة */
      background-color: #000000;
      color: #ffffff;
      padding: 5px 18px;  /* عرض وارتفاع المستطيل الأسود */
      font-size: clamp(13px, 2.2vw, 20px); /* حجم خط متوسط متناسق مع الشاشة */
      font-weight: 900;
      letter-spacing: 1.5px;
      border-radius: 3px;
      z-index: 2147483647;
      pointer-events: none;
      user-select: none;
    }

    .fullscreen-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 2147483647;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="player-wrapper">
    <video id="video" controls autoplay playsinline controlsList="nofullscreen"></video>
    <div class="foul-watermark">FOUL TV</div>
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ تكبير الشاشة</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const wrapper = document.getElementById('player-wrapper');
    const streamUrl = 'http://silka.m3um9xplus.org:2052/live/10375497945304/24779171855387/677066.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }
  </script>
</body>
</html>
